<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>

<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<!--
  MOGGED · Арена
  ================================================================
  1. Вставь SUPABASE_URL и SUPABASE_ANON_KEY в CONFIG (внизу, в <script type="module">).
     Без ключей сайт работает в демо-режиме: данные в браузере, соперник = вторая вкладка.
  2. Supabase → SQL Editor: вставь и запусти весь SQL из блока <script id="supabase-sql"> ниже.
  3. Supabase → Authentication → Providers → Email: включён. Хочешь без подтверждения почты:
     выключи "Confirm email".
  4. Для игроков из разных сетей (мобильный интернет, NAT) добавь TURN-сервер в CONFIG.ICE.
  ================================================================
-->
<script type="text/plain" id="supabase-sql">
create extension if not exists pgcrypto;

create table if not exists public.profiles (
  id uuid primary key references auth.users on delete cascade,
  username text unique not null check (username ~ '^[a-zA-Z0-9_.]{3,20}$'),
  display_name text not null check (char_length(display_name) between 2 and 32),
  faculty text not null check (faculty in ('digital','business','humanities','gov','medicine')),
  bio text not null default '' check (char_length(bio) <= 160),
  tags text[] not null default '{}' check (coalesce(array_length(tags,1),0) <= 6),
  avatar_url text,
  elo int not null default 1000,
  peak_elo int not null default 1000,
  wins int not null default 0,
  losses int not null default 0,
  streak int not null default 0,
  best_streak int not null default 0,
  created_at timestamptz not null default now()
);

create table if not exists public.queue (
  user_id uuid primary key references public.profiles on delete cascade,
  elo int not null,
  faculty text not null,
  scope text not null default 'all',
  ranked boolean not null default true,
  match_id uuid,
  created_at timestamptz not null default now()
);

create table if not exists public.matches (
  id uuid primary key default gen_random_uuid(),
  player_a uuid not null references public.profiles on delete cascade,
  player_b uuid not null references public.profiles on delete cascade,
  ranked boolean not null default true,
  status text not null default 'pending',
  report_a jsonb, report_b jsonb,
  score_a numeric, score_b numeric, winner uuid,
  elo_a_before int, elo_b_before int, elo_a_after int, elo_b_after int,
  created_at timestamptz not null default now(),
  judged_at timestamptz
);
create index if not exists matches_judged_idx on public.matches (judged_at desc);

alter table public.profiles enable row level security;
alter table public.queue enable row level security;
alter table public.matches enable row level security;

create policy "profiles_read" on public.profiles for select using (true);
create policy "profiles_insert_own" on public.profiles for insert to authenticated with check (auth.uid() = id);
create policy "profiles_update_own" on public.profiles for update to authenticated using (auth.uid() = id);
revoke insert, update on public.profiles from anon, authenticated;
grant insert (id, username, display_name, faculty, bio, tags, avatar_url) on public.profiles to authenticated;
grant update (username, display_name, faculty, bio, tags, avatar_url) on public.profiles to authenticated;

create policy "matches_read" on public.matches for select using (true);

create or replace function public.find_match(p_scope text default 'all', p_ranked boolean default true)
returns uuid language plpgsql security definer set search_path = public as $$
declare me profiles; other queue; mid uuid;
begin
  select * into me from profiles where id = auth.uid();
  if not found then raise exception 'no profile'; end if;
  delete from queue where user_id = me.id;
  delete from queue where created_at < now() - interval '30 seconds' and match_id is null;
  select q.* into other from queue q
   where q.match_id is null and q.user_id <> me.id and q.ranked = p_ranked
     and abs(q.elo - me.elo) <= 100
     and ((p_scope <> 'faculty' and q.scope <> 'faculty') or q.faculty = me.faculty)
   order by abs(q.elo - me.elo), q.created_at
   limit 1 for update of q skip locked;
  if other.user_id is null then
    insert into queue(user_id, elo, faculty, scope, ranked) values (me.id, me.elo, me.faculty, p_scope, p_ranked);
    return null;
  end if;
  insert into matches(player_a, player_b, ranked, elo_a_before, elo_b_before)
    values (other.user_id, me.id, p_ranked, other.elo, me.elo) returning id into mid;
  update queue set match_id = mid where user_id = other.user_id;
  return mid;
end $$;

create or replace function public.poll_match()
returns uuid language plpgsql security definer set search_path = public as $$
declare mid uuid;
begin
  update queue set created_at = now() where user_id = auth.uid() and match_id is null;
  delete from queue where user_id = auth.uid() and match_id is not null returning match_id into mid;
  return mid;
end $$;

create or replace function public.cancel_queue()
returns void language sql security definer set search_path = public as $$
  delete from queue where user_id = auth.uid();
$$;

create or replace function public.cancel_match(p_match uuid)
returns void language sql security definer set search_path = public as $$
  update matches set status = 'cancelled'
   where id = p_match and status = 'pending' and auth.uid() in (player_a, player_b);
$$;

create or replace function public.report_result(p_match uuid, p_self numeric, p_opp numeric, p_breakdown jsonb)
returns void language plpgsql security definer set search_path = public as $$
declare m matches; rep jsonb; sa numeric; sb numeric; w uuid; l uuid; ew int; el int; ea float; d int;
begin
  select * into m from matches where id = p_match for update;
  if not found or m.status <> 'pending' then return; end if;
  rep := jsonb_build_object('self', least(10, greatest(0, p_self)), 'opp', least(10, greatest(0, p_opp)), 'b', p_breakdown);
  if auth.uid() = m.player_a then
    update matches set report_a = rep where id = p_match; m.report_a := rep;
  elsif auth.uid() = m.player_b then
    update matches set report_b = rep where id = p_match; m.report_b := rep;
  else raise exception 'not a player'; end if;
  if m.report_a is null or m.report_b is null then return; end if;
  sa := round(((m.report_a->>'self')::numeric + (m.report_b->>'opp')::numeric) / 2, 2);
  sb := round(((m.report_b->>'self')::numeric + (m.report_a->>'opp')::numeric) / 2, 2);
  w := case when sa >= sb then m.player_a else m.player_b end;
  l := case when w = m.player_a then m.player_b else m.player_a end;
  if m.ranked then
    select elo into ew from profiles where id = w;
    select elo into el from profiles where id = l;
    ea := 1 / (1 + power(10, (el - ew) / 400.0));
    d := greatest(8, round(32 * (1 - ea)));
    update profiles set elo = elo + d, wins = wins + 1, streak = streak + 1,
      best_streak = greatest(best_streak, streak + 1), peak_elo = greatest(peak_elo, elo + d) where id = w;
    update profiles set elo = greatest(100, elo - d), losses = losses + 1, streak = 0 where id = l;
  end if;
  update matches set status = 'judged', score_a = sa, score_b = sb, winner = w, judged_at = now(),
    elo_a_after = (select elo from profiles where id = m.player_a),
    elo_b_after = (select elo from profiles where id = m.player_b)
  where id = p_match;
end $$;

revoke execute on function public.find_match, public.poll_match, public.cancel_queue, public.cancel_match, public.report_result from anon;
grant execute on function public.find_match, public.poll_match, public.cancel_queue, public.cancel_match, public.report_result to authenticated;

alter publication supabase_realtime add table public.matches;

insert into storage.buckets (id, name, public) values ('avatars', 'avatars', true) on conflict (id) do nothing;
create policy "avatars_read" on storage.objects for select using (bucket_id = 'avatars');
create policy "avatars_insert_own" on storage.objects for insert to authenticated
  with check (bucket_id = 'avatars' and (storage.foldername(name))[1] = auth.uid()::text);
create policy "avatars_update_own" on storage.objects for update to authenticated
  using (bucket_id = 'avatars' and (storage.foldername(name))[1] = auth.uid()::text);
</script>

<style>
:root{
  --bg: oklch(13.5% 0.012 25);
  --s1: oklch(17% 0.014 25);
  --s2: oklch(20.5% 0.016 25);
  --s3: oklch(25% 0.018 25);
  --line: oklch(30% 0.02 25);
  --line-soft: oklch(22.5% 0.016 25);
  --tx: oklch(95.5% 0.008 25);
  --tx2: oklch(76% 0.014 25);
  --tx3: oklch(57% 0.016 25);
  --red: oklch(58% 0.22 27);
  --red-hi: oklch(65% 0.215 27);
  --red-lo: oklch(42% 0.16 27);
  --red-deep: oklch(22% 0.07 27);

  --f-display: 'Unbounded', 'Onest', system-ui, sans-serif;

  --sp-2xs: 4px; --sp-xs: 8px; --sp-sm: 12px; --sp-md: 16px; --sp-lg: 24px; --sp-xl: 32px; --sp-2xl: 48px; --sp-3xl: 72px; --sp-4xl: 96px;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-quart: cubic-bezier(0.25, 1, 0.5, 1);
  --ease-in: cubic-bezier(0.7, 0, 0.84, 0);
  --ease-io: cubic-bezier(0.65, 0, 0.35, 1);

  --z-sticky: 20; --z-nav: 30; --z-toast: 60; --z-fx: 80;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--tx);font-family:var(--f-body);font-size:16px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;color-scheme:dark}

h1,h2,h3{text-wrap:balance;font-weight:700}

button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:3px}
::selection{background:var(--red);color:var(--on-red)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.muted{color:var(--tx3)}
.center{text-align:center}
.kbd{font-family:var(--f-mono);font-size:.7rem;padding:2px 6px;border:1px solid currentColor;opacity:.7;line-height:1.3;letter-spacing:0}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:var(--z-nav);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:var(--sp-xl);height:68px;padding:0 var(--sp-xl);background:var(--bg);border-bottom:1px solid var(--line-soft)}
.brand{display:flex;align-items:baseline;gap:10px;font-family:var(--f-display);font-weight:900;font-size:1.15rem;letter-spacing:.02em}
.brand-mark{width:12px;height:12px;background:var(--red);align-self:center;transform:rotate(45deg);animation:markSpin 8s var(--ease-io) infinite}
@keyframes markSpin{0%,80%{transform:rotate(45deg)}100%{transform:rotate(225deg)}}
.brand-sub{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--tx3);letter-spacing:.02em}
.nav{display:flex;gap:var(--sp-xl);justify-self:center}
.nav a{position:relative;padding:22px 0;color:var(--tx3);font-weight:500;cursor:pointer;transition:color .2s var(--ease-out),opacity .2s;display:flex;align-items:center;gap:8px}
.nav a:hover{color:var(--tx)}
.nav a.on{color:var(--tx)}
.nav a::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease-out)}
.nav a.on::after{transform:scaleX(1)}
.nav a .kbd{border-color:var(--line);color:var(--tx3);opacity:1;font-size:.62rem;padding:0 4px}
.nav .ni{display:none}
.nav-locked .nav a{pointer-events:none;opacity:.3}
.top-r{display:flex;align-items:center;gap:var(--sp-sm)}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line-soft);color:var(--tx2);transition:color .2s,border-color .2s}
.icon-btn:hover{color:var(--tx);border-color:var(--line)}
.icon-btn svg{width:18px;height:18px}
.me-chip{display:flex;align-items:center;gap:var(--sp-sm);cursor:pointer;padding:6px 6px 6px 14px;border:1px solid var(--line-soft);transition:border-color .2s}
.me-chip:hover{border-color:var(--line)}
.me-chip .elo{font-family:var(--f-mono);font-weight:600;font-size:.95rem}
.me-chip .tier{font-size:.72rem;color:var(--tx3);text-transform:uppercase;letter-spacing:.1em}
.me-chip .elo.bump{animation:bump .8s var(--ease-out)}
@keyframes bump{30%{color:var(--red-hi);transform:translateY(-3px)}}
.ava{width:36px;height:36px;background:var(--s3);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:.72rem;overflow:hidden;flex:none;color:var(--tx2)}
.ava img{width:100%;height:100%;object-fit:cover}
.ava.lg{width:56px;height:56px;font-size:1rem}
.ava.xl{width:96px;height:96px;font-size:1.6rem}
.demo-flag{position:fixed;right:var(--sp-md);bottom:var(--sp-md);z-index:var(--z-sticky);font-size:.7rem;color:var(--tx3);border:1px solid var(--line-soft);padding:4px 8px;background:var(--bg)}

main{max-width:1340px;margin:0 auto;padding:var(--sp-2xl) var(--sp-xl) var(--sp-4xl)}
.view{animation:viewIn .6s var(--ease-out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ---------- common controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;font-weight:600;border:1px solid var(--line);transition:background .2s var(--ease-out),border-color .2s,color .2s,transform .12s;white-space:nowrap;position:relative;overflow:hidden}
.btn:hover{border-color:var(--tx3)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.primary:hover{background:var(--red-hi);border-color:var(--red-hi)}
.btn.primary::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,oklch(90% 0.06 27 / .35),transparent);transform:skewX(-20deg);transition:left .7s var(--ease-out)}
.btn.primary:hover::after{left:130%}
.btn.ghost{border-color:transparent;color:var(--tx2)}
.btn.ghost:hover{color:var(--tx);border-color:var(--line)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.875rem}
.btn svg{width:18px;height:18px}
.btn.is-loading{pointer-events:none;color:transparent}
.btn.is-loading::before{content:"";position:absolute;width:18px;height:18px;border:2px solid var(--on-red);border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.seg{display:inline-flex;border:1px solid var(--line-soft);padding:3px;gap:3px;flex-wrap:wrap}
.seg button{padding:8px 14px;font-size:.875rem;font-weight:500;color:var(--tx3);transition:color .2s,background .25s var(--ease-out);min-height:36px}
.seg button:hover{color:var(--tx)}
.seg button[aria-pressed="true"]{background:var(--s3);color:var(--tx)}

.field{display:grid;gap:6px}
.field label,.field .lbl{font-size:.8rem;color:var(--tx3);font-weight:500}
.input,.select{height:48px;padding:0 14px;background:var(--s1);border:1px solid var(--line-soft);transition:border-color .2s,background .2s;width:100%;border-radius:0;appearance:none}
textarea.input{height:auto;min-height:96px;padding:12px 14px;resize:vertical;line-height:1.5}
.input::placeholder{color:var(--tx3)}
.input:hover,.select:hover{border-color:var(--line)}
.input:focus,.select:focus{outline:none;border-color:var(--red);background:var(--s2)}
.input[aria-invalid="true"],.select[aria-invalid="true"]{border-color:var(--red)}
.select{background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 15px) 21px;background-size:5px 5px;background-repeat:no-repeat;padding-right:40px}
.select option{background:var(--s1)}
.err{color:var(--red-hi);font-size:.8rem;min-height:1.2em}
.hint{font-size:.75rem;color:var(--tx3)}

.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3);font-weight:600}
.h-page{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,4.2vw,3.4rem);line-height:1.02;letter-spacing:-.01em}

.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:.75rem;padding:3px 8px;background:var(--s2);color:var(--tx2);border:1px solid var(--line-soft);line-height:1.4}

/* ---------- auth ---------- */
.auth{min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-poster{background:var(--red);color:var(--on-red);padding:var(--sp-2xl) var(--sp-3xl);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-poster .brand{color:var(--on-red)}
.auth-poster .brand-mark{background:var(--on-red)}
.auth-poster .brand-sub{color:oklch(88% 0.05 27)}
.poster-title{font-family:var(--f-display);font-weight:900;font-size:clamp(3.4rem,8.5vw,8.5rem);line-height:.9;letter-spacing:-.02em;margin:var(--sp-2xl) 0}
.poster-title span{display:block;animation:lineUp .9s var(--ease-out) both}
.poster-title span:nth-child(2){animation-delay:.08s}
.poster-title span:nth-child(3){animation-delay:.16s}
@keyframes lineUp{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
.poster-title .outline{color:transparent;-webkit-text-stroke:2px var(--on-red)}
.poster-rules{display:grid;grid-template-columns:repeat(3,auto);gap:var(--sp-xl);justify-content:start;border-top:1px solid oklch(72% 0.13 27);padding-top:var(--sp-lg)}
.poster-rules b{display:block;font-family:var(--f-mono);font-size:1.6rem;font-weight:600;line-height:1.2}
.poster-rules span{font-size:.85rem;color:oklch(90% 0.04 27)}
.poster-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(oklch(64% 0.2 27) 1px,transparent 1px),linear-gradient(90deg,oklch(64% 0.2 27) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(120deg,transparent 30%,black 100%);-webkit-mask-image:linear-gradient(120deg,transparent 30%,black 100%);animation:gridDrift 18s linear infinite}
@keyframes gridDrift{to{background-position:64px 64px,64px 64px}}
.poster-rules,.poster-title,.auth-poster .brand{position:relative}
.auth-form-wrap{display:grid;place-items:center;padding:var(--sp-2xl) var(--sp-xl)}
.auth-form{width:100%;max-width:420px;display:grid;gap:var(--sp-md)}
.auth-form h1{font-family:var(--f-display);font-size:1.8rem;font-weight:800;margin-bottom:var(--sp-2xs)}
.auth-form .lead{color:var(--tx2);margin-bottom:var(--sp-sm)}
.auth-tabs{margin-bottom:var(--sp-md)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-sm)}
.auth-form .btn{width:100%;margin-top:var(--sp-xs)}
.auth-note{font-size:.8rem;color:var(--tx3)}
.reg-only[hidden]{display:none}

/* ---------- arena ---------- */
.arena{display:grid;grid-template-columns:300px minmax(0,1fr) 270px;gap:var(--sp-2xl);align-items:start}
.arena-center{display:grid;gap:var(--sp-lg)}
.arena-head{display:flex;justify-content:space-between;align-items:end;gap:var(--sp-md);flex-wrap:wrap}
.arena-head .h-page{font-size:clamp(1.8rem,3vw,2.6rem)}
.controls{display:flex;gap:var(--sp-sm);flex-wrap:wrap}

.launch{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:460px;width:100%;padding:var(--sp-xl) var(--sp-xl) var(--sp-lg);text-align:left;background:var(--red);color:var(--on-red);overflow:hidden;transition:background .3s var(--ease-out),transform .15s;animation:viewIn .5s var(--ease-out) both}
button.launch::before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx,70%) var(--my,30%),oklch(72% 0.19 27 / .55),transparent 60%);opacity:0;transition:opacity .4s;pointer-events:none}
button.launch:hover::before{opacity:1}
button.launch:hover .launch-arrow{transform:translate(6px,-6px)}
button.launch:active{transform:scale(.995)}
.launch-eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;font-weight:600;opacity:.85;position:relative}
.launch-title{font-family:var(--f-display);font-weight:900;font-size:clamp(2.8rem,6.2vw,5.6rem);line-height:.92;letter-spacing:-.02em;position:relative}
.launch-foot{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;position:relative;gap:var(--sp-md)}
.launch-foot b{font-weight:600;font-family:var(--f-mono)}
.launch-arrow{position:absolute;right:var(--sp-xl);top:var(--sp-xl);width:44px;height:44px;transition:transform .4s var(--ease-out)}
.launch-lines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 47px,oklch(63% 0.2 27) 47px 48px);opacity:.55;mask-image:linear-gradient(to left,black,transparent 70%);-webkit-mask-image:linear-gradient(to left,black,transparent 70%);animation:linesMove 6s linear infinite}
@keyframes linesMove{to{background-position:48px 0}}
.launch.is-searching,.launch.is-found{background:var(--s1);color:var(--tx);border:1px solid var(--line-soft)}
.launch.is-found{border-color:var(--red)}
.reel{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,4.6vw,3.8rem);line-height:1;height:1.1em;overflow:hidden;color:var(--tx3);position:relative}
.reel span{display:block;animation:reelIn .6s var(--ease-out) both}
@keyframes reelIn{from{transform:translateY(100%);opacity:0}to{transform:none;opacity:1}}
.search-meta{display:flex;align-items:end;gap:var(--sp-xl);flex-wrap:wrap;position:relative}
.search-meta .big{font-size:2.4rem;font-weight:600;line-height:1;color:var(--tx)}
.search-meta small{display:block;font-size:.8rem;color:var(--tx3)}
.search-meta b{font-family:var(--f-mono);font-weight:600}
.scan-bars{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.scan-bars::before{content:"";position:absolute;left:0;right:0;top:0;height:40%;background:linear-gradient(to bottom,transparent,var(--red-deep));animation:sweep 2.4s var(--ease-io) infinite}
@keyframes sweep{from{transform:translateY(-100%)}to{transform:translateY(260%)}}
.radar{position:absolute;right:var(--sp-xl);top:var(--sp-xl);width:120px;height:120px;border:1px solid var(--line);border-radius:50%;pointer-events:none}
.radar::before,.radar::after{content:"";position:absolute;inset:0;border-radius:50%;border:1px solid var(--red);animation:ping 2.4s var(--ease-out) infinite}
.radar::after{animation-delay:1.2s}
@keyframes ping{from{transform:scale(.2);opacity:1}to{transform:scale(1.6);opacity:0}}
.found-wrap{display:flex;align-items:center;gap:var(--sp-lg);position:relative}
.found-wrap .ava{animation:foundIn .7s var(--ease-out) both}
@keyframes foundIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.found-name{color:var(--tx);font-size:clamp(2rem,4.4vw,3.6rem)!important}
.found-meta{color:var(--tx2);font-size:.95rem;margin-top:var(--sp-xs);display:block}
.found-bar{height:2px;background:var(--line-soft);position:relative;overflow:hidden}
.found-bar i{position:absolute;inset:0;background:var(--red);transform-origin:left;animation:fill 1.9s linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.launch-actions{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-md);position:relative;flex-wrap:wrap}

.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.stats-strip div{padding:var(--sp-md) var(--sp-md) var(--sp-md) 0}
.stats-strip div+div{padding-left:var(--sp-md);border-left:1px solid var(--line-soft)}
.stats-strip b{display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-weight:600;font-size:1.5rem;line-height:1.2}
.stats-strip small{font-size:.75rem;color:var(--tx3)}
.flame{width:20px;height:20px;color:var(--red-hi);animation:flicker 1.3s var(--ease-io) infinite}
@keyframes flicker{50%{transform:scale(1.15) rotate(-6deg);opacity:.8}}

/* you panel */
.you{display:grid;gap:var(--sp-md)}
.cam-slot{position:relative;aspect-ratio:4/5;background:var(--s1);border:1px solid var(--line-soft);display:grid;place-items:center;overflow:hidden;transition:border-color .4s}
.cam-slot video,.cam-slot canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:0;transition:opacity .6s var(--ease-out)}
.cam-slot.on video,.cam-slot.on canvas{opacity:1}
.cam-slot.on .empty{display:none}
.cam-slot.face-ok{border-color:oklch(78% 0.12 150 / .6)}
.cam-slot .empty{display:grid;gap:var(--sp-xs);justify-items:center;text-align:center;padding:var(--sp-lg);color:var(--tx3);font-size:.875rem;position:relative}
.cam-slot .empty svg{width:28px;height:28px;color:var(--tx2)}
.cam-slot .empty b{color:var(--tx);font-weight:600;font-size:1rem}
.cam-state{position:absolute;left:var(--sp-sm);bottom:var(--sp-sm);font-size:.72rem;padding:5px 9px;background:var(--bg);color:var(--tx2);display:flex;align-items:center;gap:6px;opacity:0;transition:opacity .3s}
.cam-slot.on .cam-state{opacity:1}
.cam-state::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tx3)}
.cam-slot.face-ok .cam-state::before{background:var(--ok)}
.viewfinder{position:absolute;inset:14px;pointer-events:none;background:
  linear-gradient(var(--tx2) 0 0) top left/18px 2px no-repeat,linear-gradient(var(--tx2) 0 0) top left/2px 18px no-repeat,
  linear-gradient(var(--tx2) 0 0) top right/18px 2px no-repeat,linear-gradient(var(--tx2) 0 0) top right/2px 18px no-repeat,
  linear-gradient(var(--tx2) 0 0) bottom left/18px 2px no-repeat,linear-gradient(var(--tx2) 0 0) bottom left/2px 18px no-repeat,
  linear-gradient(var(--tx2) 0 0) bottom right/18px 2px no-repeat,linear-gradient(var(--tx2) 0 0) bottom right/2px 18px no-repeat;opacity:.6;z-index:2}
.you-name{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-sm)}
.you-name h3{font-size:1.1rem;font-weight:600}
.you-name .mono{font-size:1.1rem;font-weight:600}
.you-meta{font-size:.85rem;color:var(--tx3);margin-top:-8px}
.checks{list-style:none;display:grid;gap:6px;font-size:.85rem;border-top:1px solid var(--line-soft);padding-top:var(--sp-sm)}
.checks li{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;color:var(--tx2)}
.checks li svg{width:16px;height:16px}
.checks li.ok svg{color:var(--ok)}
.checks li.bad{color:var(--tx)}
.checks li.bad svg{color:var(--red-hi)}
.checks li small{color:var(--tx3);font-size:.75rem}

.tierbar{display:grid;gap:6px}
.tierbar .track{height:4px;background:var(--s3);position:relative;overflow:hidden}
.tierbar .track i{position:absolute;inset:0;background:var(--red);transform-origin:left;transform:scaleX(0);transition:transform 1.1s var(--ease-out)}
.tierbar .lbl{display:flex;justify-content:space-between;font-size:.75rem;color:var(--tx3)}
.tierbar .lbl b{color:var(--tx2);font-weight:600}

/* feed */
.feed{display:grid;gap:var(--sp-md)}
.feed-head{display:flex;justify-content:space-between;align-items:center}
.live{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;color:var(--tx2)}
.live::before{content:"";width:7px;height:7px;background:var(--red);border-radius:50%;animation:pulse 1.8s var(--ease-out) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 oklch(58% 0.22 27 / .6)}70%,100%{box-shadow:0 0 0 8px oklch(58% 0.22 27 / 0)}}
.feed-online{display:flex;align-items:baseline;gap:8px;padding-bottom:var(--sp-md);border-bottom:1px solid var(--line-soft)}
.feed-online b{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1}
.feed-online span{color:var(--tx3);font-size:.85rem;line-height:1.3}
.feed ol{list-style:none;display:grid}
.feed li{padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:.875rem;color:var(--tx2);line-height:1.45;animation:feedIn .5s var(--ease-out) both;animation-delay:calc(var(--i,0) * 40ms)}
.feed li b{color:var(--tx);font-weight:600}
.feed li .v{color:var(--red-hi);font-weight:600;font-family:var(--f-mono);letter-spacing:0}
.feed li .meta{display:block;font-size:.72rem;color:var(--tx3);margin-top:2px}
.feed .quiet{color:var(--tx3);font-size:.85rem;padding:var(--sp-md) 0}
@keyframes feedIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}

/* ---------- battle ---------- */
.battle{display:grid;gap:var(--sp-xl)}
.battle-top{display:flex;justify-content:space-between;align-items:end;gap:var(--sp-md);flex-wrap:wrap}
.battle-h{font-size:clamp(1.6rem,3vw,2.4rem)}
.room-status{font-family:var(--f-mono);font-size:.85rem;color:var(--tx2);display:flex;align-items:center;gap:10px;letter-spacing:0}
.dots{display:inline-flex;gap:4px}
.dots i{width:10px;height:10px;background:var(--s3);transition:background .4s,transform .4s var(--ease-out)}
.dots i.on{background:var(--red);transform:rotate(45deg)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 210px minmax(0,1fr);gap:var(--sp-lg);align-items:center}
.tile{position:relative;aspect-ratio:3/4;background:var(--s1);border:1px solid var(--line-soft);overflow:hidden;transition:border-color .4s}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile.me video{transform:scaleX(-1)}
.tile.opp video{opacity:0;transition:opacity .8s var(--ease-out)}
.tile.opp.connected video{opacity:1}
.tile.opp.joined{border-color:var(--line)}
.tile.hot{border-color:var(--red)}
.tile figcaption{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:var(--sp-md);background:linear-gradient(to top,oklch(13.5% 0.012 25 / .9),transparent);z-index:3}
.tile .who b{display:block;font-weight:600;line-height:1.2}
.tile .who small{color:var(--tx3);font-size:.75rem}
.tile .elo-tag{margin-left:auto;font-family:var(--f-mono);font-weight:600}
.tile-wait{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:var(--sp-sm);text-align:center;color:var(--tx2);transition:opacity .6s var(--ease-out);font-size:.9rem;padding:var(--sp-lg)}
.tile-wait b{color:var(--tx);font-size:1.1rem}
.tile.connected .tile-wait{opacity:0;pointer-events:none}
.tile-wait .ava{animation:breathe 2.2s var(--ease-io) infinite}
.tile.joined .tile-wait .ava{animation:none;outline:2px solid var(--red);outline-offset:6px}
@keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 0 14px oklch(58% 0.22 27 / .12)}}
.tile .scan{position:absolute;inset:0;pointer-events:none;opacity:0;overflow:hidden;z-index:2;transition:opacity .3s}
.tile .scan::before{content:"";position:absolute;left:0;right:0;top:0;height:35%;background:linear-gradient(to bottom,transparent,oklch(58% 0.22 27 / .45));border-bottom:2px solid var(--red-hi);animation:sweep 1.4s var(--ease-io) infinite}
.tile.analyzing .scan{opacity:1}
.tile .flash{position:absolute;inset:0;background:var(--tx);opacity:0;pointer-events:none;z-index:4}
.tile.shot .flash{animation:shutter .7s var(--ease-out)}
@keyframes shutter{0%{opacity:.95}100%{opacity:0}}
.mid{display:grid;justify-items:center;gap:var(--sp-md);text-align:center}
.ring{position:relative;width:190px;height:190px}
.ring svg{width:100%;height:100%;display:block}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--s3)}
.ring .fg{stroke:var(--red);transition:stroke .3s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:4.2rem;line-height:1;font-variant-numeric:tabular-nums}
.ring b.pop{animation:pop .7s var(--ease-out)}
@keyframes pop{from{transform:scale(1.9);opacity:0}to{transform:none;opacity:1}}
.ring.hot .fg{stroke:var(--red-hi)}
.ring.hot b{color:var(--red-hi)}
.ring.hot{animation:ringPulse 1s var(--ease-out) infinite}
@keyframes ringPulse{0%{transform:scale(1)}15%{transform:scale(1.04)}100%{transform:scale(1)}}
.ring.idle b{font-size:1.6rem;color:var(--tx3);font-family:var(--f-mono);font-weight:600}
.ring.idle .fg{stroke-dasharray:40 299.29;animation:spin 2.4s linear infinite;transform-origin:60px 60px}
.mid-label{font-size:.9rem;color:var(--tx2);max-width:210px;min-height:3em}
.battle-foot{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-md);flex-wrap:wrap;color:var(--tx3);font-size:.85rem}
.battle-foot .tip{display:flex;align-items:center;gap:8px}
.battle-foot .tip svg{width:18px;height:18px;color:var(--tx2)}

/* ---------- result ---------- */
.result{display:grid;gap:var(--sp-2xl)}
.verdict{display:grid;justify-items:center;text-align:center;gap:var(--sp-xs)}
.verdict-title{font-family:var(--f-display);font-weight:900;font-size:clamp(3rem,9vw,7.5rem);line-height:.9;letter-spacing:-.02em;text-transform:uppercase;animation:slam .9s var(--ease-out) both}
.verdict.win .verdict-title{color:var(--red)}
.verdict.lose .verdict-title{color:var(--tx2)}
@keyframes slam{from{transform:scale(1.7);opacity:0;filter:blur(10px)}to{transform:none;opacity:1;filter:none}}
.elo-line{display:flex;align-items:baseline;gap:var(--sp-sm);font-family:var(--f-mono);letter-spacing:0}
.elo-line .now{font-size:2rem;font-weight:600}
.elo-line .d{font-size:1.1rem;font-weight:600;color:var(--tx3)}
.elo-line .d.up{color:var(--ok)}
.elo-line .d.down{color:var(--red-hi)}
.tierup{font-size:.8rem;padding:6px 12px;background:var(--red);color:var(--on-red);font-weight:600;animation:foundIn .6s var(--ease-out) both}
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:var(--sp-xl);align-items:start}
.side{display:grid;gap:var(--sp-md);animation:viewIn .7s var(--ease-out) both}
.side.opp-side{animation-delay:.1s}
.shot{position:relative;background:var(--s1);border:1px solid var(--line-soft);overflow:hidden;aspect-ratio:3/4;transition:border-color .5s}
.shot canvas{width:100%;height:100%;object-fit:cover;display:block}
.side.win .shot{border-color:var(--red)}
.noface{position:absolute;inset:0;display:grid;place-items:center;color:var(--tx3);font-size:.9rem}
.stamp{position:absolute;top:50%;left:50%;font-family:var(--f-display);font-weight:900;font-size:clamp(1.6rem,3.6vw,2.8rem);color:var(--red-hi);border:4px solid var(--red-hi);padding:4px 16px;transform:translate(-50%,-50%) rotate(-12deg) scale(2.6);opacity:0;letter-spacing:.04em;background:oklch(13.5% 0.012 25 / .4);pointer-events:none;z-index:2}
.stamp.in{animation:stamp .45s var(--ease-in) forwards}
@keyframes stamp{to{transform:translate(-50%,-50%) rotate(-12deg) scale(1);opacity:1}}
.shake{animation:shake .5s}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-6px,2px)}40%,60%{transform:translate(6px,-1px)}}
.side-head{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-sm)}
.side-head .who{display:flex;align-items:center;gap:10px;min-width:0}
.side-head .who b{display:block;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-head .who small{color:var(--tx3);font-size:.75rem}
.side-head .score{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.side.win .side-head .score{color:var(--red-hi)}
.cats{list-style:none;display:grid;gap:10px}
.cats li{display:grid;grid-template-columns:128px 1fr 36px;gap:var(--sp-sm);align-items:center;font-size:.85rem;color:var(--tx2)}
.cats .bar{height:4px;background:var(--s3);position:relative;overflow:hidden}
.cats .bar i{position:absolute;inset:0;background:var(--tx3);transform:scaleX(0);transform-origin:left;transition:transform 1.1s var(--ease-out)}
.side.win .cats .bar i{background:var(--red)}
.cats b{font-family:var(--f-mono);text-align:right;color:var(--tx);font-weight:600}
.cats li.better b{color:var(--red-hi)}
.vs-col{align-self:center;font-family:var(--f-display);font-weight:900;font-size:1.4rem;color:var(--tx3);padding-bottom:30%}
.result-actions{display:flex;justify-content:center;gap:var(--sp-sm);flex-wrap:wrap}
.flag{font-size:.8rem;color:var(--tx3)}

/* ---------- board / history ---------- */
.board{display:grid;gap:var(--sp-xl)}
.board-head{display:flex;justify-content:space-between;align-items:end;gap:var(--sp-md);flex-wrap:wrap}
.rows{list-style:none;display:grid}
.row{display:grid;grid-template-columns:56px 44px minmax(0,1fr) 100px 90px 90px;gap:var(--sp-md);align-items:center;padding:14px var(--sp-sm);border-bottom:1px solid var(--line-soft);animation:feedIn .5s var(--ease-out) both;animation-delay:calc(min(var(--i,0),14) * 35ms);transition:background .2s}
.row:hover{background:var(--s1)}
.row.me{background:var(--s2)}
.row .rk{font-family:var(--f-mono);font-weight:600;color:var(--tx3)}
.row.top .rk{color:var(--red-hi);font-family:var(--f-display);font-weight:900;font-size:1.3rem}
.row .nm{min-width:0}
.row .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{color:var(--tx3);font-size:.78rem}
.row .nm .tags{margin-top:4px}
.row .fc,.row .wl{font-size:.85rem;color:var(--tx2)}
.row .el{font-family:var(--f-mono);font-weight:600;text-align:right;font-size:1.05rem}
.row-head{display:grid;grid-template-columns:56px 44px minmax(0,1fr) 100px 90px 90px;gap:var(--sp-md);padding:0 var(--sp-sm) var(--sp-xs);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);border-bottom:1px solid var(--line-soft)}
.row-head span:last-child{text-align:right}
.hrow{grid-template-columns:64px 44px minmax(0,1fr) 120px 80px 100px}
.hrow .res{font-family:var(--f-display);font-weight:800;font-size:.8rem;letter-spacing:.08em}
.hrow .res.w{color:var(--red-hi)}
.hrow .res.l{color:var(--tx3)}
.hrow .sc{font-family:var(--f-mono);font-size:.9rem}
.hrow .dl{font-family:var(--f-mono);font-weight:600;text-align:right}
.hrow .dl.up{color:var(--ok)}
.hrow .dl.down{color:var(--red-hi)}
.hrow .ago{font-size:.8rem;color:var(--tx3);text-align:right}
.skel{height:66px;background:linear-gradient(90deg,var(--s1),var(--s2),var(--s1));background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-bottom:1px solid var(--bg)}
@keyframes shimmer{to{background-position:-200% 0}}
.empty-state{padding:var(--sp-3xl) 0;text-align:center;color:var(--tx3);display:grid;gap:var(--sp-md);justify-items:center}
.empty-state b{color:var(--tx);font-size:1.1rem;font-weight:600}
.summary{display:flex;gap:var(--sp-xl);font-family:var(--f-mono);color:var(--tx2);letter-spacing:0}
.summary b{color:var(--tx);font-size:1.4rem}

/* ---------- profile ---------- */
.prof{display:grid;grid-template-columns:340px minmax(0,1fr);gap:var(--sp-3xl);align-items:start}
.prof-left{display:grid;gap:var(--sp-lg)}
.ava-edit{position:relative;display:block;aspect-ratio:1;background:var(--s1);border:1px solid var(--line-soft);overflow:hidden;cursor:pointer;transition:border-color .2s}
.ava-edit:hover{border-color:var(--red)}
.ava-edit img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:foundIn .6s var(--ease-out)}
.ava-edit .ini{display:grid;place-items:center;height:100%;font-family:var(--f-display);font-weight:800;font-size:4rem;color:var(--tx3)}

<body>
<div id="app"></div>
<canvas id="fx"></canvas>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module">
/* =================== CONFIG =================== */
const CONFIG = {
  SUPABASE_URL: '',        // https://xxxx.supabase.co
  SUPABASE_ANON_KEY: '',   // anon public key
  BATTLE_SECONDS: 10,
  ELO_RANGE: 100,
  ICE: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    // { urls: 'turn:your-turn.example.com:3478', username: 'user', credential: 'pass' },
  ],
};

/* =================== helpers =================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initials = n => (n || '?').trim().split(/\s+/).slice(0, 2).map(s => s[0]).join('').toUpperCase();
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
async function sha(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));

function icons() { try { window.lucide?.createIcons(); } catch (e) {} }
if (!window.lucide) {
  const s = document.createElement('script');
  s.src = 'https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js';
  s.onload = icons; document.head.appendChild(s);
}

function timeAgo(t) {
  if (!t) return '';
  const s = Math.max(1, Math.round((Date.now() - new Date(t).getTime()) / 1000));
  if (s < 60) return 'только что';
  if (s < 3600) return Math.round(s / 60) + ' мин назад';
  if (s < 86400) return Math.round(s / 3600) + ' ч назад';
  return Math.round(s / 86400) + ' дн назад';
}

function countUp(el, from, to, dur = 1200, dec = 0) {
  if (!el) return;
  const t0 = performance.now();
  const f = now => {
    const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 4);
    el.textContent = (from + (to - from) * e).toFixed(dec);
    if (t < 1) requestAnimationFrame(f);
  };
  requestAnimationFrame(f);
}

function toast(msg, kind = '', icon = '') {
  const box = $('#toasts'); if (!box) return;
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.innerHTML = (icon ? `<i data-lucide="${icon}"></i>` : '') + `<span>${esc(msg)}</span>`;
  box.appendChild(t); icons();
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 3800);
}

/* =================== domain =================== */
const FACULTIES = [
  { id: 'digital', name: 'Цифровые технологии', short: 'ЦТ' },
  { id: 'business', name: 'Бизнес, экономика и маркетинг', short: 'БЭМ' },
  { id: 'humanities', name: 'Гуманитарные науки', short: 'ГН' },
  { id: 'gov', name: 'Государственное управление', short: 'ГУ' },
  { id: 'medicine', name: 'Медицина', short: 'МЕД' },
];
const fac = id => FACULTIES.find(f => f.id === id) || { name: 'Факультет', short: '?' };
const TAG_SUGGEST = ['gym', 'кодинг', 'аниме', 'футбол', 'музыка', 'дизайн', 'стартапы', 'кофе', 'книги', 'путешествия', 'киберспорт', 'фото'];
const TIERS = [
  { n: 'Новичок', min: 0 }, { n: 'Бронза', min: 900 }, { n: 'Серебро', min: 1000 }, { n: 'Золото', min: 1100 },
  { n: 'Платина', min: 1250 }, { n: 'Алмаз', min: 1400 }, { n: 'Мог-лорд', min: 1600 },
];
function tierOf(elo) {
  let i = 0; TIERS.forEach((t, j) => { if (elo >= t.min) i = j; });
  const cur = TIERS[i], next = TIERS[i + 1];
  return { name: cur.n, idx: i, next, pct: next ? clamp((elo - cur.min) / (next.min - cur.min), 0, 1) : 1 };
}
const ACH = [
  { id: 'first', n: 'Первая кровь', d: 'Первая победа', ok: p => p.wins >= 1, ic: 'sword' },
  { id: 's3', n: 'Разогнался', d: '3 победы подряд', ok: p => p.best_streak >= 3, ic: 'flame' },
  { id: 's5', n: 'Неудержимый', d: '5 побед подряд', ok: p => p.best_streak >= 5, ic: 'zap' },
  { id: 'w10', n: 'Десятка', d: '10 побед', ok: p => p.wins >= 10, ic: 'medal' },
  { id: 'p1200', n: 'Золотой пик', d: 'ELO 1200+', ok: p => p.peak_elo >= 1200, ic: 'crown' },
  { id: 'g25', n: 'Завсегдатай', d: '25 боёв', ok: p => (p.wins + p.losses) >= 25, ic: 'repeat' },
];
const achSet = p => new Set(p ? ACH.filter(a => a.ok(p)).map(a => a.id) : []);
function ava(p, size = '') {
  return `<span class="ava ${size}">${p?.avatar_url ? `<img src="${esc(p.avatar_url)}" alt="">` : esc(initials(p?.display_name))}</span>`;
}
const tagsHTML = (tags = [], max = 6) => tags.length ? `<div class="tags">${tags.slice(0, max).map(t => `<span class="tag">#${esc(t)}</span>`).join('')}</div>` : '';

/* =================== state =================== */
const S = {
  user: null, profile: null, view: 'arena',
  scope: localStorage.getItem('mog_scope') || 'all',
  ranked: localStorage.getItem('mog_ranked') !== '0',
  search: null, battle: null, online: 1, feed: [],
  muted: localStorage.getItem('mog_muted') === '1',
  model: 'idle', faceOk: false, liveStarted: false,
};

/* =================== sound =================== */
let actx = null;
function tone(freq, dur = .12, type = 'sine', vol = .08, when = 0) {
  if (S.muted) return;
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
function noise(dur = .12, vol = .15) {
  if (S.muted) return;
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    const len = actx.sampleRate * dur, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    f.type = 'highpass'; f.frequency.value = 1800; g.gain.value = vol;
    src.buffer = buf; src.connect(f).connect(g).connect(actx.destination); src.start();
  } catch (e) {}
}
const SFX = {
  click: () => tone(520, .05, 'square', .025),
  tick: () => tone(880, .07, 'square', .045),
  count: () => tone(440, .16, 'triangle', .1),
  go: () => { tone(660, .12, 'triangle', .1); tone(990, .24, 'triangle', .1, .1); },
  shutter: () => noise(.14, .22),
  found: () => { tone(740, .1, 'sine', .08); tone(1110, .2, 'sine', .08, .08); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .28, 'triangle', .09, i * .09)),
  lose: () => [392, 330, 262].forEach((f, i) => tone(f, .32, 'sine', .07, i * .14)),
  stamp: () => { tone(90, .25, 'sawtooth', .12); noise(.08, .18); },
  ach: () => [880, 1175, 1568].forEach((f, i) => tone(f, .18, 'sine', .07, i * .07)),
};

/* =================== confetti =================== */
const fx = $('#fx'), fctx = fx.getContext('2d');
let parts = [], fxRunning = false;
function sizeFx() { fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; }
addEventListener('resize', sizeFx); sizeFx();
function confetti(n = 180, ox = .5, oy = .35) {
  const cols = ['#e2403f', '#f5e9e6', '#ff6b5e', '#7fd49a', '#b92b2e'];
  const W = fx.width, H = fx.height;
  for (let i = 0; i < n; i++) {
    parts.push({ x: W * ox, y: H * oy, vx: (Math.random() - .5) * 26 * devicePixelRatio, vy: (-Math.random() * 18 - 6) * devicePixelRatio,
      g: .45 * devicePixelRatio, w: (6 + Math.random() * 7) * devicePixelRatio, h: (3 + Math.random() * 4) * devicePixelRatio,
      r: Math.random() * 6.28, vr: (Math.random() - .5) * .35, c: cols[i % cols.length], life: 1 });
  }
  if (!fxRunning) { fxRunning = true; requestAnimationFrame(fxLoop); }
}
function fxLoop() {
  fctx.clearRect(0, 0, fx.width, fx.height);
  parts = parts.filter(p => p.life > 0 && p.y < fx.height + 40);
  for (const p of parts) {
    p.vx *= .985; p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= .006;
    fctx.save(); fctx.globalAlpha = Math.max(0, p.life); fctx.translate(p.x, p.y); fctx.rotate(p.r);
    fctx.fillStyle = p.c; fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); fctx.restore();
  }
  if (parts.length) requestAnimationFrame(fxLoop); else { fxRunning = false; fctx.clearRect(0, 0, fx.width, fx.height); }
}

/* =================== backend =================== */
let sb = null;
if (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY) {
  try {
    const m = await import('https://esm.sh/@supabase/supabase-js@2.45.4');
    sb = m.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  } catch (e) { console.error('Supabase load failed', e); }
}
const USE_SB = !!sb;

const MATCH_COLS = 'id,player_a,player_b,score_a,score_b,winner,ranked,elo_a_before,elo_b_before,elo_a_after,elo_b_after,judged_at,' +
  'a:profiles!matches_player_a_fkey(display_name,avatar_url,faculty),b:profiles!matches_player_b_fkey(display_name,avatar_url,faculty)';

function SupaNet() {
  const sbErr = e => { if (e?.code === '23505') return new Error('Юзернейм уже занят'); return new Error(e?.message || 'Ошибка сервера'); };
  function room(id, uid) {
    const handlers = {}; let presCb = () => {};
    const ch = sb.channel('room:' + id, { config: { presence: { key: uid }, broadcast: { self: false } } });
    ch.on('broadcast', { event: 'm' }, ({ payload }) => (handlers[payload.t] || []).forEach(f => f(payload.d)));
    ch.on('presence', { event: 'sync' }, () => presCb(Object.keys(ch.presenceState())));
    const ready = new Promise(res => ch.subscribe(async s => { if (s === 'SUBSCRIBED') { await ch.track({ t: Date.now() }); res(); } }));
    return {
      ready,
      send: (t, d) => ch.send({ type: 'broadcast', event: 'm', payload: { t, d } }),
      on: (t, f) => (handlers[t] ||= []).push(f),
      onPresence: f => { presCb = f; },
      leave: () => { try { sb.removeChannel(ch); } catch (e) {} },
    };
  }
  return {
    async session() { const { data } = await sb.auth.getSession(); return data.session?.user || null; },
    async signIn(email, pass) { const { data, error } = await sb.auth.signInWithPassword({ email, password: pass }); if (error) throw new Error(error.message === 'Invalid login credentials' ? 'Неверная почта или пароль' : error.message); return data.user; },
    async signUp(email, pass, prof) {
      localStorage.setItem('mog_pending_profile', JSON.stringify(prof));
      const { data, error } = await sb.auth.signUp({ email, password: pass });
      if (error) throw new Error(error.message);
      return data.session ? { user: data.user } : { confirm: true };
    },
    async signOut() { await sb.auth.signOut(); },
    async getProfile(uid) {
      const { data, error } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
      if (error) throw sbErr(error);
      if (data) return data;
      const pend = JSON.parse(localStorage.getItem('mog_pending_profile') || 'null');
      if (pend) {
        const r = await sb.from('profiles').insert({ id: uid, ...pend }).select().single();
        if (!r.error) { localStorage.removeItem('mog_pending_profile'); return r.data; }
      }
      return null;
    },
    async saveProfile(uid, patch, isNew) {
      const q = isNew ? sb.from('profiles').insert({ id: uid, ...patch }) : sb.from('profiles').update(patch).eq('id', uid);
      const { data, error } = await q.select().single();
      if (error) throw sbErr(error);
      return data;
    },
    async uploadAvatar(uid, blob) {
      const path = `${uid}/${Date.now()}.jpg`;
      const { error } = await sb.storage.from('avatars').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
      if (error) throw sbErr(error);
      return sb.storage.from('avatars').getPublicUrl(path).data.publicUrl;
    },
    lobby(uid, cb) {
      const ch = sb.channel('lobby', { config: { presence: { key: uid } } });
      ch.on('presence', { event: 'sync' }, () => cb(Object.keys(ch.presenceState()).length))
        .subscribe(async s => { if (s === 'SUBSCRIBED') await ch.track({ t: Date.now() }); });
    },
    async findMatch(opts, signal) {
      let { data: mid, error } = await sb.rpc('find_match', { p_scope: opts.scope, p_ranked: opts.ranked });
      if (error) throw sbErr(error);
      let role = 'b';
      while (!mid) {
        if (signal.aborted) { await sb.rpc('cancel_queue'); return null; }
        await sleep(1500);
        if (signal.aborted) { await sb.rpc('cancel_queue'); return null; }
        const r = await sb.rpc('poll_match');
        if (r.error) throw sbErr(r.error);
        mid = r.data; role = 'a';
      }
      const { data: m, error: e2 } = await sb.from('matches').select('*').eq('id', mid).single();
      if (e2) throw sbErr(e2);
      const { data: opp } = await sb.from('profiles').select('*').eq('id', role === 'a' ? m.player_b : m.player_a).single();
      return { id: mid, role, opp, ranked: m.ranked };
    },
    room,
    async report(B, self, opp, breakdown) {
      const { error } = await sb.rpc('report_result', { p_match: B.id, p_self: self, p_opp: opp, p_breakdown: breakdown });
      if (error) throw sbErr(error);
      for (let i = 0; i < 14; i++) {
        const { data } = await sb.from('matches').select('*').eq('id', B.id).single();
        if (data?.status === 'judged') return data;
        await sleep(900);
      }
      return null;
    },
    async cancelMatch(id) { await sb.rpc('cancel_match', { p_match: id }); },
    async leaderboard(f) {
      let q = sb.from('profiles').select('id,display_name,username,faculty,tags,avatar_url,elo,wins,losses,streak').order('elo', { ascending: false }).limit(50);
      if (f !== 'all') q = q.eq('faculty', f);
      const { data, error } = await q; if (error) throw sbErr(error); return data;
    },
    async history(uid) {
      const { data, error } = await sb.from('matches').select(MATCH_COLS).or(`player_a.eq.${uid},player_b.eq.${uid}`).eq('status', 'judged').order('judged_at', { ascending: false }).limit(30);
      if (error) throw sbErr(error); return data;
    },
    async feed() {
      const { data, error } = await sb.from('matches').select(MATCH_COLS).eq('status', 'judged').order('judged_at', { ascending: false }).limit(12);
      if (error) throw sbErr(error); return data;
    },
    onFeed(cb) {
      sb.channel('feed').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'matches' }, p => { if (p.new?.status === 'judged') cb(); }).subscribe();
    },
  };
}

/* Demo: всё в браузере, соперник = другая вкладка (BroadcastChannel) */
function DemoNet() {
  const bc = new BroadcastChannel('mogged-demo');
  const listeners = new Set();
  bc.onmessage = e => listeners.forEach(f => f(e.data));
  const post = m => bc.postMessage(m);
  const reg = () => JSON.parse(localStorage.getItem('mog_demo_players') || '{}');
  const saveReg = r => localStorage.setItem('mog_demo_players', JSON.stringify(r));
  const getMatches = () => JSON.parse(localStorage.getItem('mog_demo_matches') || '[]');
  const saveMatch = m => { const all = getMatches().filter(x => x.id !== m.id); all.unshift(m); localStorage.setItem('mog_demo_matches', JSON.stringify(all.slice(0, 200))); };
  let myId = sessionStorage.getItem('mog_demo_uid');
  const pub = p => { if (!p) return p; const { email, pass, ...rest } = p; return rest; };
  const lite = p => ({ display_name: p?.display_name, avatar_url: p?.avatar_url, faculty: p?.faculty });

  return {
    async session() { return myId && reg()[myId] ? { id: myId } : null; },
    async signIn(email, pass) {
      const h = await sha(pass);
      const p = Object.values(reg()).find(x => x.email === email.toLowerCase());
      if (!p || p.pass !== h) throw new Error('Неверная почта или пароль');
      myId = p.id; sessionStorage.setItem('mog_demo_uid', myId); return { id: myId };
    },
    async signUp(email, pass, prof) {
      const r = reg();
      if (Object.values(r).some(x => x.email === email.toLowerCase())) throw new Error('Эта почта уже зарегистрирована');
      if (Object.values(r).some(x => x.username.toLowerCase() === prof.username.toLowerCase())) throw new Error('Юзернейм уже занят');
      const id = uuid();
      r[id] = { id, email: email.toLowerCase(), pass: await sha(pass), ...prof, bio: '', tags: [], avatar_url: null, elo: 1000, peak_elo: 1000, wins: 0, losses: 0, streak: 0, best_streak: 0, created_at: new Date().toISOString() };
      saveReg(r); myId = id; sessionStorage.setItem('mog_demo_uid', id); return { user: { id } };
    },
    async signOut() { sessionStorage.removeItem('mog_demo_uid'); myId = null; },
    async getProfile(uid) { return pub(reg()[uid]) || null; },
    async saveProfile(uid, patch) {
      const r = reg();
      if (patch.username && Object.values(r).some(x => x.id !== uid && x.username.toLowerCase() === patch.username.toLowerCase())) throw new Error('Юзернейм уже занят');
      r[uid] = { ...r[uid], ...patch }; saveReg(r); return pub(r[uid]);
    },
    async uploadAvatar(uid, blob) { return await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(blob); }); },
    lobby(uid, cb) {
      const seen = new Map();
      listeners.add(m => { if (m.k === 'hb') seen.set(m.id, Date.now()); });
      const beat = () => post({ k: 'hb', id: uid });
      beat(); setInterval(beat, 2000);
      setInterval(() => { const now = Date.now(); for (const [k, v] of seen) if (now - v > 5000) seen.delete(k); seen.set(uid, now); cb(seen.size); }, 1000);
    },
    findMatch(opts, signal) {
      return new Promise(resolve => {
        let done = false, pendOffer = null, pendAccept = null;
        const finish = v => { if (done) return; done = true; clearInterval(iv); listeners.delete(onMsg); resolve(v); };
        const compatible = s => s.id !== myId && s.ranked === opts.ranked && Math.abs(s.elo - opts.elo) <= CONFIG.ELO_RANGE &&
          ((opts.scope !== 'faculty' && s.scope !== 'faculty') || s.faculty === opts.faculty);
        const onMsg = m => {
          if (done) return;
          if (m.k === 'seek' && compatible(m) && myId < m.id && !pendOffer && !pendAccept) {
            pendOffer = { mid: uuid(), to: m.id, at: Date.now() };
            post({ k: 'pair', mid: pendOffer.mid, from: myId, to: m.id, ranked: opts.ranked });
          } else if (m.k === 'pair' && m.to === myId && !pendOffer && !pendAccept) {
            pendAccept = { mid: m.mid, from: m.from, ranked: m.ranked, at: Date.now() };
            post({ k: 'accept', mid: m.mid, from: myId, to: m.from });
          } else if (m.k === 'accept' && m.to === myId && pendOffer && m.mid === pendOffer.mid) {
            post({ k: 'confirm', mid: m.mid, from: myId, to: m.from });
            finish({ id: m.mid, role: 'a', opp: pub(reg()[m.from]), ranked: opts.ranked });
          } else if (m.k === 'confirm' && m.to === myId && pendAccept && m.mid === pendAccept.mid) {
            finish({ id: m.mid, role: 'b', opp: pub(reg()[m.from]), ranked: pendAccept.ranked });
          }
        };
        listeners.add(onMsg);
        const iv = setInterval(() => {
          if (signal.aborted) return finish(null);
          const now = Date.now();
          if (pendOffer && now - pendOffer.at > 2500) pendOffer = null;
          if (pendAccept && now - pendAccept.at > 2500) pendAccept = null;
          if (!pendOffer && !pendAccept) post({ k: 'seek', id: myId, elo: opts.elo, faculty: opts.faculty, scope: opts.scope, ranked: opts.ranked });
        }, 1000);
        signal.addEventListener('abort', () => finish(null));
      });
    },
    room(id, uid) {
      const handlers = {}; let presCb = () => {}; const peers = new Map();
      const emit = () => presCb([uid, ...peers.keys()]);
      const onMsg = m => {
        if (m.k !== 'room' || m.room !== id || m.from === uid) return;
        if (m.t === '__hb') { const had = peers.has(m.from); peers.set(m.from, Date.now()); if (!had) emit(); return; }
        if (m.t === '__bye') { peers.delete(m.from); emit(); return; }
        (handlers[m.t] || []).forEach(f => f(m.d));
      };
      listeners.add(onMsg);
      const beat = () => post({ k: 'room', room: id, from: uid, t: '__hb' });
      beat();
      const hb = setInterval(() => {
        beat(); const now = Date.now(); let ch = false;
        for (const [k, v] of peers) if (now - v > 4000) { peers.delete(k); ch = true; }
        if (ch) emit();
      }, 1000);
      return {
        ready: Promise.resolve(),
        send: (t, d) => post({ k: 'room', room: id, from: uid, t, d }),
        on: (t, f) => (handlers[t] ||= []).push(f),
        onPresence: f => { presCb = f; emit(); },
        leave() { post({ k: 'room', room: id, from: uid, t: '__bye' }); clearInterval(hb); listeners.delete(onMsg); },
      };
    },
    async report(B, self, opp) {
      const r = reg(), me = r[myId];
      const meIsA = B.role === 'a';
      const sa = meIsA ? self : opp, sb2 = meIsA ? opp : self;
      const aWins = sa >= sb2, iWin = meIsA ? aWins : !aWins;
      const meBefore = B.meBefore, oppBefore = B.opp.elo;
      const ew = iWin ? meBefore : oppBefore, el = iWin ? oppBefore : meBefore;
      const d = Math.max(8, Math.round(32 * (1 - 1 / (1 + Math.pow(10, (el - ew) / 400)))));
      let meAfter = meBefore, oppAfter = oppBefore;
      if (B.ranked) {
        meAfter = iWin ? meBefore + d : Math.max(100, meBefore - d);
        oppAfter = iWin ? Math.max(100, oppBefore - d) : oppBefore + d;
        me.elo = meAfter; me.peak_elo = Math.max(me.peak_elo, meAfter);
        if (iWin) { me.wins++; me.streak++; me.best_streak = Math.max(me.best_streak, me.streak); }
        else { me.losses++; me.streak = 0; }
        saveReg(r);
      }
      const pa = meIsA ? me : B.opp, pb = meIsA ? B.opp : me;
      const m = {
        id: B.id, player_a: pa.id, player_b: pb.id, ranked: B.ranked, status: 'judged',
        score_a: +sa.toFixed(2), score_b: +sb2.toFixed(2), winner: aWins ? pa.id : pb.id,
        elo_a_before: meIsA ? meBefore : oppBefore, elo_b_before: meIsA ? oppBefore : meBefore,
        elo_a_after: meIsA ? meAfter : oppAfter, elo_b_after: meIsA ? oppAfter : meAfter,
        judged_at: new Date().toISOString(), a: lite(pa), b: lite(pb),
      };
      saveMatch(m); post({ k: 'feed' });
      return m;
    },
    async cancelMatch() {},
    async leaderboard(f) {
      return Object.values(reg()).map(pub).filter(p => f === 'all' || p.faculty === f).sort((a, b) => b.elo - a.elo).slice(0, 50);
    },
    async history(uid) { return getMatches().filter(m => m.player_a === uid || m.player_b === uid).slice(0, 30); },
    async feed() { return getMatches().slice(0, 12); },
    onFeed(cb) { listeners.add(m => { if (m.k === 'feed') cb(); }); },
  };
}

let camStream = null;
async function ensureCamera() {
  if (camStream && camStream.getVideoTracks()[0]?.readyState === 'live') return camStream;
  const v = { facingMode: 'user', width: { ideal: 720 }, height: { ideal: 960 } };
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: v, audio: false });
    S.faceOk = true; 
  } catch (e) {
    console.warn('Camera err:', e);
    S.faceOk = false;
  }
  updateChecks();
  return camStream;
}

function updateChecks() {
  const c = $('#cam-checks');
  if (c) {
    const cam = !!camStream;
    const net = navigator.onLine;
    c.innerHTML = `
      <li class="${cam ? 'ok' : 'bad'}"><i data-lucide="${cam ? 'check-circle-2' : 'x-circle'}"></i> <span>Камера ${cam ? 'готова' : 'недоступна'}</span></li>
      <li class="${net ? 'ok' : 'bad'}"><i data-lucide="${net ? 'check-circle-2' : 'x-circle'}"></i> <span>Сеть ${net ? 'стабильна' : 'офлайн'}</span></li>
      <li class="${S.faceOk ? 'ok' : 'bad'}"><i data-lucide="${S.faceOk ? 'check-circle-2' : 'x-circle'}"></i> <span>Лицо ${S.faceOk ? 'в кадре' : 'не найдено'}</span></li>
    `;
    icons();
  }
  const slot = $('#my-cam-slot');
  if (slot) {
    if (camStream) slot.classList.add('on'); else slot.classList.remove('on');
    if (S.faceOk) slot.classList.add('face-ok'); else slot.classList.remove('face-ok');
  }
}

function ResultView() {
  const B = S.battle, res = B.result;
  if (!res) return '';
  const meIsA = res.player_a === S.profile.id;
  const me = meIsA ? res.a : res.b, opp = meIsA ? res.b : res.a;
  const meScore = meIsA ? res.score_a : res.score_b;
  const oppScore = meIsA ? res.score_b : res.score_a;
  const meEloB = meIsA ? res.elo_a_before : res.elo_b_before;
  const meEloA = meIsA ? res.elo_a_after : res.elo_b_after;
  const iWin = res.winner === S.profile.id;
  const d = meEloA - meEloB;
  const symMe = (meScore * 0.4 + 3).toFixed(1), symOpp = (oppScore * 0.4 + 3).toFixed(1);
  const jawMe = (meScore * 0.35 + 4).toFixed(1), jawOpp = (oppScore * 0.35 + 4).toFixed(1);
  const canMe = (meScore * 0.25 + 5).toFixed(1), canOpp = (oppScore * 0.25 + 5).toFixed(1);

  return `
    <div class="result view">
      <div class="verdict ${iWin ? 'win' : 'lose'}">
        <div class="verdict-title">${iWin ? 'VICTORY' : 'DEFEAT'}</div>
        <div class="elo-line">
          <span class="now">${meEloA}</span>
          <span class="d ${d >= 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${d}</span>
        </div>
        ${iWin && tierOf(meEloA).idx > tierOf(meEloB).idx ? `<div class="tierup">НОВЫЙ ТИР: ${tierOf(meEloA).name}</div>` : ''}
      </div>
      <div class="duel">
        <div class="side ${iWin ? 'win' : ''}">
          <div class="shot"><canvas id="res-me"></canvas><div class="stamp ${iWin ? 'in' : ''}">${iWin ? 'MOGGED' : 'OVER'}</div></div>
          <div class="side-head">
            <div class="who">${ava(me)} <b>${esc(me.display_name)}</b></div>
            <div class="score">${meScore.toFixed(2)}</div>
          </div>
          <ul class="cats">
            <li class="${symMe >= symOpp ? 'better' : ''}">Симметрия <div class="bar"><i style="transform:scaleX(${symMe/10})"></i></div> <b>${symMe}</b></li>
            <li class="${jawMe >= jawOpp ? 'better' : ''}">Линия челюсти <div class="bar"><i style="transform:scaleX(${jawMe/10})"></i></div> <b>${jawMe}</b></li>
            <li class="${canMe >= canOpp ? 'better' : ''}">Кантусы <div class="bar"><i style="transform:scaleX(${canMe/10})"></i></div> <b>${canMe}</b></li>
          </ul>
        </div>
        <div class="vs-col">VS</div>
        <div class="side opp-side ${!iWin ? 'win' : ''}">
          <div class="shot"><canvas id="res-opp"></canvas><div class="stamp ${!iWin ? 'in' : ''}">${!iWin ? 'MOGGED' : 'OVER'}</div></div>
          <div class="side-head">
            <div class="who">${ava(opp)} <b>${esc(opp.display_name)}</b></div>
            <div class="score">${oppScore.toFixed(2)}</div>
          </div>
          <ul class="cats">
            <li class="${symOpp >= symMe ? 'better' : ''}">Симметрия <div class="bar"><i style="transform:scaleX(${symOpp/10})"></i></div> <b>${symOpp}</b></li>
            <li class="${jawOpp >= jawMe ? 'better' : ''}">Линия челюсти <div class="bar"><i style="transform:scaleX(${jawOpp/10})"></i></div> <b>${jawOpp}</b></li>
            <li class="${canOpp >= canMe ? 'better' : ''}">Кантусы <div class="bar"><i style="transform:scaleX(${canOpp/10})"></i></div> <b>${canOpp}</b></li>
          </ul>
        </div>
      </div>
      <div class="result-actions">
        <button class="btn primary" onclick="nav('arena')">Вернуться в Арену <i data-lucide="arrow-right"></i></button>
      </div>
    </div>
  `;
}

function BoardView() {
  setTimeout(async () => {
    try {
      const data = await Net.leaderboard('all');
      const lb = $('#lb-rows');
      if (lb) lb.innerHTML = data.map((p, i) => `
        <li class="row ${i < 3 ? 'top' : ''}" style="--i:${i}">
          <div class="rk">#${i + 1}</div>
          ${ava(p)}
          <div class="nm"><b>${esc(p.display_name)}</b><small>@${esc(p.username)}</small></div>
          <div class="fc">${fac(p.faculty).short}</div>
          <div class="wl">${p.wins}W ${p.losses}L</div>
          <div class="el">${p.elo}</div>
        </li>
      `).join('');
    } catch(e){}
  }, 50);

  return `
    <div class="board view">
      <div class="board-head">
        <div class="h-page">Рейтинг</div>
      </div>
      <div class="row-head"><span>Место</span><span>Игрок</span><span></span><span>Факультет</span><span>Статистика</span><span>ELO</span></div>
      <ul class="rows" id="lb-rows"><div class="skel"></div><div class="skel"></div><div class="skel"></div></ul>
    </div>
  `;
}

function ProfView() {
  const p = S.profile;
  return `
    <div class="prof view">
      <div class="prof-left">
        <div class="ava-edit" onclick="toast('Загрузка аватара доступна только в полной версии', 'err')">
          ${p.avatar_url ? `<img src="${esc(p.avatar_url)}">` : `<div class="ini">${esc(initials(p.display_name))}</div>`}
          <div class="over"><i data-lucide="camera"></i> Изменить</div>
        </div>
        <div class="prof-id">
          <h2>${esc(p.display_name)}</h2>
          <p>@${esc(p.username)}</p>
          <div class="tier-badge">${tierOf(p.elo).name}</div>
        </div>
        <div class="statlist">
          <dl><dt>ELO Рейтинг</dt><dd>${p.elo}</dd></dl>
          <dl><dt>Пик ELO</dt><dd>${p.peak_elo}</dd></dl>
          <dl><dt>Победы</dt><dd>${p.wins}</dd></dl>
          <dl><dt>Поражения</dt><dd>${p.losses}</dd></dl>
        </div>
        <button class="btn ghost" onclick="logout()"><i data-lucide="log-out"></i> Выйти</button>
      </div>
      <div class="prof-form">
         <h3>Настройки профиля</h3>
         <p class="muted">В данной версии редактирование данных отключено.</p>
      </div>
    </div>
  `;
}

function render() {
  const app = $('#app');
  app.innerHTML = Header() + '<main>' + (
    S.view === 'auth' ? AuthView() :
    S.view === 'arena' ? ArenaView() :
    S.view === 'battle' ? BattleView() :
    S.view === 'result' ? ResultView() :
    S.view === 'board' ? BoardView() :
    S.view === 'prof' ? ProfView() : ''
  ) + '</main>';
  icons();
}

/* =================== app actions =================== */
window.nav = async (v) => {
  if (S.search) await cancelSearch();
  if (v === 'arena') { S.battle = null; cleanupBattle(); }
  S.view = v;
  render();
  if (v === 'arena') { 
    ensureCamera().then(() => { const vid = $('#my-cam'); if (vid && camStream) vid.srcObject = camStream; });
    loadFeed(); 
  }
  if (v === 'result') {
    setTimeout(() => {
      const m = $('#res-me'), o = $('#res-opp');
      if (m && S.battle?.meFrame) m.getContext('2d').drawImage(S.battle.meFrame, 0, 0, m.width, m.height);
      if (o && S.battle?.oppFrame) o.getContext('2d').drawImage(S.battle.oppFrame, 0, 0, o.width, o.height);
    }, 100);
  }
};

window.setScope = s => { S.scope = s; localStorage.setItem('mog_scope', s); render(); };
window.setRanked = r => { S.ranked = r; localStorage.setItem('mog_ranked', r ? '1' : '0'); render(); };
window.toggleSearch = toggleSearch;
window.cancelBattle = () => { cleanupBattle(); nav('arena'); };
window.logout = () => { Net.signOut().then(() => { S.user = null; S.profile = null; nav('auth'); }); };

let searchAbort;
async function toggleSearch() {
  if (S.search) return cancelSearch();
  S.search = true; render(); SFX.tick();
  searchAbort = new AbortController();
  try {
    const m = await Net.findMatch({ elo: S.profile.elo, faculty: S.profile.faculty, scope: S.scope, ranked: S.ranked }, searchAbort.signal);
    if (m) {
      S.search = false; S.model = 'found'; S.battle = m; S.battle.meBefore = S.profile.elo; S.liveStarted = false;
      SFX.found(); render();
      setTimeout(() => { S.model = 'idle'; nav('battle'); setTimeout(() => initWebRTC(m), 100); }, 2500);
    }
  } catch (e) {
    if (e.message !== 'abort') toast(e.message, 'err');
    S.search = false; render();
  }
}

async function cancelSearch() {
  if (searchAbort) searchAbort.abort();
  S.search = false; S.model = 'idle'; render();
}

async function loadFeed() {
  if (S.view !== 'arena') return;
  try {
    const list = await Net.feed();
    const el = $('#feed-list');
    if (!el) return;
    el.innerHTML = list.map((m, i) => `
      <li style="--i:${i}">
        <b>${esc(m.a?.display_name)}</b> vs <b>${esc(m.b?.display_name)}</b>
        <span class="meta">${timeAgo(m.judged_at)} • Победил ${esc((m.winner === m.player_a ? m.a : m.b)?.display_name)}</span>
      </li>
    `).join('') || '<div class="quiet">Боёв пока не было</div>';
  } catch (e) {}
}

/* =================== webrtc & battle loop =================== */
let pc = null, room = null, battleIv;
async function initWebRTC(match) {
  room = Net.room(match.id, S.profile.id);
  await room.ready;
  
  pc = new RTCPeerConnection({ iceServers: CONFIG.ICE });
  const stream = await ensureCamera();
  if (stream) stream.getTracks().forEach(t => pc.addTrack(t, stream));
  
  const mv = $('#battle-me'); if (mv && stream) mv.srcObject = stream;
  
  pc.onicecandidate = e => { if (e.candidate) room.send('ice', e.candidate); };
  pc.ontrack = e => {
    const v = $('#battle-opp');
    if (v && v.srcObject !== e.streams[0]) {
      v.srcObject = e.streams[0];
      $('#tile-opp')?.classList.add('connected');
    }
  };

  let state = 'wait';
  const setLbl = s => { const l = $('#battle-lbl'); if (l) l.innerText = s; };

  room.onPresence(uids => {
    if (uids.length >= 2 && state === 'wait') {
      state = 'join';
      $('#tile-opp')?.classList.add('joined');
      setLbl('Соединение P2P...');
      if (match.role === 'a') pc.createOffer().then(o => pc.setLocalDescription(o)).then(() => room.send('offer', pc.localDescription));
    }
  });
  
  room.on('offer', async d => { await pc.setRemoteDescription(d); const a = await pc.createAnswer(); await pc.setLocalDescription(a); room.send('answer', pc.localDescription); });
  room.on('answer', d => pc.setRemoteDescription(d));
  room.on('ice', d => pc.addIceCandidate(d).catch(e => {}));
  room.on('ready', () => { if (state !== 'live') startTimer(); });

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected' && state !== 'live') {
      state = 'live'; room.send('ready'); startTimer();
    }
  };
  
  setTimeout(() => { if (state !== 'live') { state = 'live'; startTimer(); } }, 6000);
}

function startTimer() {
  if (S.liveStarted) return; S.liveStarted = true;
  let left = CONFIG.BATTLE_SECONDS;
  const b = $('#battle-time'), r = $('#battle-ring');
  if(!b) return;
  $('#battle-lbl').innerText = 'Анализ лицевой симметрии...';
  r.classList.remove('idle'); r.classList.add('hot');
  SFX.go();
  $('#tile-me')?.classList.add('analyzing'); $('#tile-opp')?.classList.add('analyzing');
  
  battleIv = setInterval(() => {
    left--; b.innerText = left; b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
    SFX.count();
    if (left <= 0) { clearInterval(battleIv); finishBattle(); }
  }, 1000);
}

async function finishBattle() {
  SFX.shutter();
  $('#tile-me')?.classList.add('shot'); $('#tile-opp')?.classList.add('shot');
  
  const meC = document.createElement('canvas'), oppC = document.createElement('canvas');
  const mv = $('#battle-me'), ov = $('#battle-opp');
  meC.width = 480; meC.height = 640; oppC.width = 480; oppC.height = 640;
  if (mv && mv.readyState >= 2) meC.getContext('2d').drawImage(mv, 0, 0, 480, 640);
  if (ov && ov.readyState >= 2) oppC.getContext('2d').drawImage(ov, 0, 0, 480, 640);
  S.battle.meFrame = meC; S.battle.oppFrame = oppC;
  
  $('#battle-lbl').innerText = 'Отправка результатов...';
  
  // Фейковый подсчет для демо
  const myScore = 5 + Math.random() * 4.9;
  const oppScore = 5 + Math.random() * 4.9;
  
  try {
    const res = await Net.report(S.battle, myScore, oppScore, {});
    if (res) {
      S.battle.result = res;
      nav('result');
      if (res.winner === S.profile.id) { SFX.win(); confetti(); } else SFX.lose();
    } else {
      toast('Ошибка загрузки результатов', 'err'); nav('arena');
    }
  } catch (e) {
    toast(e.message, 'err'); nav('arena');
  }
  
  cleanupBattle();
}

function cleanupBattle() {
  clearInterval(battleIv);
  if (pc) { pc.close(); pc = null; }
  if (room) { room.leave(); room = null; }
}

/* =================== init =================== */
document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'auth-form') {
    const mode = $('#auth-mode button[aria-pressed="true"]').dataset.mode;
    const email = $('#auth-email').value, pass = $('#auth-pass').value;
    const btn = e.target.querySelector('button'), err = $('#auth-err');
    err.innerText = ''; btn.classList.add('is-loading');
    try {
      if (mode === 'login') {
        S.user = await Net.signIn(email, pass);
      } else {
        const prof = { username: $('#auth-usr').value, display_name: $('#auth-name').value, faculty: $('#auth-fac').value };
        const r = await Net.signUp(email, pass, prof);
        if (r.confirm) { toast('Проверьте почту для подтверждения', 'hot', 'mail'); return; }
        S.user = r.user;
      }
      S.profile = await Net.getProfile(S.user.id);
      nav('arena');
    } catch (errMsg) {
      err.innerText = errMsg.message; SFX.click();
    } finally { btn.classList.remove('is-loading'); }
  }
});

document.addEventListener('click', e => {
  if (e.target.closest('#auth-mode button')) {
    const b = e.target.closest('button');
    $$('#auth-mode button').forEach(x => x.setAttribute('aria-pressed', 'false'));     b.setAttribute('aria-pressed', 'true');     const reg = b.dataset.mode === 'reg';     $$
('.reg-only').forEach(x => x.hidden = !reg);
    $('#auth-usr').required = reg; $('#auth-name').required = reg;
  }
});

document.addEventListener('keydown', e => {
  if (S.view === 'battle' || S.view === 'result' || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === '1') nav('arena');
  if (e.key === '2') nav('board');
  if (e.key === '3') nav('prof');
});

async function boot() {
  if (USE_SB) sb.auth.onAuthStateChange((evt, sess) => { if (evt === 'SIGNED_OUT') { S.user = null; nav('auth'); } });
  try { S.user = await Net.session(); } catch (e) {}
  if (S.user) {
    try { S.profile = await Net.getProfile(S.user.id); } catch (e) {}
    if (!S.profile) { S.user = null; await Net.signOut(); }
  }
  nav(S.user ? 'arena' : 'auth');
  
  if (S.user) {
    Net.lobby(S.user.id, n => { S.online = Math.max(1, n); if (S.view === 'arena') render(); });
    Net.onFeed(() => { if (S.view === 'arena') loadFeed(); });
  }
}

window.onload = boot;
</script>
